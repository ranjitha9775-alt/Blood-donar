<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LifeDrop · Blood-bank review</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; color: #20242b; background: #f5f6f8; }
    body { margin: 0; }
    header { background: white; border-bottom: 1px solid #e2e5ea; }
    .nav, main { width: min(100% - 32px, 1000px); margin: auto; }
    .nav { min-height: 58px; display: flex; align-items: center; justify-content: space-between; }
    .brand { color: #252932; font-weight: 750; text-decoration: none; }
    .brand span { color: #bd2939; }
    button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #b82335; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    main { padding: 25px 0 50px; }
    .card { margin: 16px 0; padding: 20px; border: 1px solid #e2e5ea; border-radius: 12px; background: white; }
    .muted, .message { color: #656c78; font-size: 14px; line-height: 1.5; }
    .screening { padding: 16px 0; border-top: 1px solid #e7e9ed; }
    .screening:first-child { border-top: 0; }
    .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
    .answer { padding: 10px; border-radius: 8px; background: #f7f8fa; }
    label { display: block; margin: 12px 0 5px; font-size: 13px; font-weight: 700; }
    textarea { width: 100%; min-height: 72px; box-sizing: border-box; padding: 10px; border: 1px solid #dfe2e8; border-radius: 8px; font: inherit; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .not-cleared { background: #545c68; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header><div class="nav"><a class="brand" href="/">Life<span>Drop</span> Blood-bank staff</a><button id="logout-button" type="button" hidden>Log out</button></div></header>
  <main>
    <h1>Private donor health screening review</h1>
    <p class="muted">Only authenticated blood-bank staff can view these voluntary responses. Review status is not a substitute for clinical assessment or final donor eligibility decisions.</p>
    <section class="card">
      <p id="reviewMessage" class="message" aria-live="polite">Checking staff access…</p>
      <div id="screenings" aria-live="polite"></div>
    </section>
  </main>
  <script src="/blood-bank-review.js" defer></script>
</body>
</html>
